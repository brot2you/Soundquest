();let slope=window.slope||0;for(let x=0;x<w;x+=4){let y=h/2-(slope*(x/w-.5))*.85+Math.sin(x/36)*9;if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke()}
function forge(){let letters=silentWords[selectedSilent%silentWords.length];let word=letters.join('');return `${head('forge','Word Forge','Détecte des lettres muettes et les terminaisons qui changent de son.')} ${tabs([['explore','Silent Letter Hunt'],['ending','Pronunciation Rules'],['build','Sound Builder'],['family','Word Transformer']])}<div class="panel">${mode==='explore'?`<h2>Silent Letter Hunt</h2><p>Écoute le mot <strong>${word}</strong>, puis sélectionne toutes ses lettres muettes. Clique ensuite sur Vérifier.</p>${btn('▶ Écouter',`speak('${word}')`,'cyan')}<div class="wordtiles">${letters.map((x,i)=>`<button class="tile ${(window.chosenSilent||[]).includes(i)?'mark':''}" onclick="toggleSilent(${i})">${x}</button>`).join('')}</div>${btn('Vérifier', 'checkSilent()','green')} ${btn('Mot suivant →',"selectedSilent++;window.chosenSilent=[];feedback='';render()",'yellow')}${feedbackBox()}`:mode==='ending'?`<h2>Les terminaisons -s et -ed</h2><p>Écoute et classe les mots selon la prononciation de leur terminaison.</p><div class="row"><button class="level" onclick="window.endingType='s';render()">-s pluriel / 3e personne</button><button class="level" onclick="window.endingType='ed';render()">-ed passé</button></div><div class="feedback info">${(window.endingType||'s')==='s'?'cats / dogs / buses':'worked / played / wanted'}</div><div class="choices">${((window.endingType||'s')==='s'?['/s/','/z/','/ɪz/']:['/t/','/d/','/ɪd/']).map((x,i)=>`<button class="choice" onclick="endingAnswer(${i})">${x}</button>`).join('')}</div>${btn('▶ Exemple',`speak(${JSON.stringify((window.endingType||'s')==='s'?['cats','dogs','buses'][challenge%3]:['worked','played','wanted'][challenge%3])})`,'cyan')}${feedbackBox()}${btn('Autre exemple →','nextChallenge()','yellow')}`:mode==='build'?`<h2>Sound Builder</h2><p>Quel groupe de lettres fait entendre /f/ dans « phone » ?</p><div class="choices">${['ph','th','sh'].map((x,i)=>`<button class="choice" onclick="buildAnswer(${i})">${x}</button>`).join('')}</div>${feedbackBox()}<p class="help">Attention : les correspondances sont des tendances, pas des règles sans exception.</p>`:`<h2>Word Transformer</h2><p>Explore une famille et compare la place de son accent.</p><div class="choices">${['PHOtograph','phoTOGraphy','photoGRAPHic'].map((x,i)=>`<button class="choice" onclick="speak(${JSON.stringify(['photograph','photography','photographic'][i])})">▶ ${x}</button>`).join('')}</div>${btn('Comparaison terminée',"gameWin('transform','Transformation de mots');mark('L’accent peut changer au sein d’une famille de mots.')",'green')}${feedbackBox()}`}</div>`}function toggleSilent(i){let a=window.chosenSilent||[];window.chosenSilent=a.includes(i)?a.filter(x=>x!==i):[...a,i];render()}function checkSilent(){let a=[...(window.chosenSilent||[])].sort().join(','),b=silentIndexes[selectedSilent%silentIndexes.length].join(',');if(a===b){gameWin('silent'+selectedSilent,'Lettres muettes');mark('Exact ! Dans ce mot, les lettres sélectionnées ne se prononcent pas.')}else mark('Il manque une lettre muette, ou tu en as choisi une qui se prononce. Réessaie.','bad')}function endingAnswer(i){if(i===challenge%3){gameWin('ending'+(window.endingType||'s')+challenge,'Terminaisons');mark('Bravo ! La terminaison correspond au son '+((window.endingType||'s')==='s'?['/s/','/z/','/ɪz/']:['/t/','/d/','/ɪd/'])[i]+'.')}else mark('Réécoute le mot et observe le dernier son avant la terminaison.','bad')}function buildAnswer(i){if(i===0){gameWin('build','Graphie-phonie');mark('Exact : « ph » se prononce /f/ dans phone.')}else mark('Regarde les deux premières lettres du mot phone.','bad')}
function accentLab(){let x=accents[selectedAccent%accents.length];return `${head('accent','Accent Switch','Compare deux variétés de référence : anglais britannique non rhotique et anglais américain général.')} ${tabs([['explore','Console UK / US'],['challenge','Accent Switch Challenge']])}<div class="split"><div class="panel"><div class="eyebrow">Deux canaux audio</div><h2>${x[0]}</h2><div class="choices"><button class="choice" onclick="accent='en-GB';speak('${x[0]}','en-GB')">UK · GB<br><span class="ipa">${x[1]}</span></button><button class="choice" onclick="accent='en-US';speak('${x[0]}','en-US')">US · USA<br><span class="ipa">${x[2]}</span></button></div><p>${x[3]}</p><p class="help">Les voix disponibles dépendent de l'appareil. Si une voix correspondant à la variété manque, la comparaison audio peut être imparfaite.</p><div class="row">${btn('◉ Comparer ma voix','toggleStudio(true)','pink')}${btn('Mot suivant →',"selectedAccent++;feedback='';render()",'yellow')}</div></div><div class="panel">${mode==='challenge'?`<h2>Accent Switch Challenge</h2><p>Dans quelle variété de référence le /r/ final de car est-il généralement prononcé ?</p><div class="choices"><button class="choice" onclick="accentAnswer(false)">UK non rhotique</button><button class="choice" onclick="accentAnswer(true)">US général</button></div>${feedbackBox()}`:`<h2>Compare et observe</h2><p>Les différences peuvent concerner la rhoticité, certaines voyelles et la réalisation de /t/.</p><div class="feedback info">${x[1]} ↔ ${x[2]}</div><p class="help">Il n’existe pas un seul « accent britannique » ou « accent américain ».</p>`}</div></div>`}function accentAnswer(v){if(v){gameWin('accentChallenge','Différences UK / US');mark('Exact ! Le General American est généralement rhotique.')}else mark('Compare /kɑː/ (UK) et /kɑɹ/ (US).','bad')}
function codex(){return `${head('codex','PhonoCodex','La bibliothèque pour retrouver les idées essentielles à ton rythme.')}<div class="panel"><label class="label" for="find">Chercher une notion</label><input id="find" class="field" style="width:100%" placeholder="Ex. schwa, intonation, consonnes…" oninput="filterCodex(this.value)"></div><div class="section-heading"><h2>Les notions clés</h2><span class="muted">Clique pour ouvrir la machine associée</span></div><div class="codex" id="codex-list">${glossary.map(([title,desc,where])=>`<button data-search="${esc((title+' '+desc).toLowerCase())}" onclick="${machines.find(m=>m[1]===where)?`go('${machines.find(m=>m[1]===where)[0]}')`:'codexHint()'}"><strong>${title}</strong><p class="muted">${desc}</p><small>→ ${where}</small></button>`).join('')}</div><div class="section-heading"><h2>Inventaire des sons</h2></div><div class="soundboard">${phonemes.map((p,i)=>`<button class="sound" onclick="currentPh=${i};go('mixer')">${p[0]}</button>`).join('')}</div><p class="foot">Contenus introductifs, non exhaustifs. Les transcriptions données correspondent à des variétés de référence et nécessitent une validation scientifique avant un usage comme corpus de référence.</p>`}function codexHint(){toast('Lis la description puis explore les machines correspondantes.')}function filterCodex(t){document.querySelectorAll('#codex-list button').forEach(b=>b.classList.toggle('hidden',!b.dataset.search.includes(t.toLowerCase())))}
function rewards(){const list=[['Explorer',4],['Inventeur sonore',10],['Maître du labo',20]];return `${head('rewards','Récompenses','Chaque badge correspond à des activités réussies.')}<div class="panel"><div class="spread"><h2>${state.points} XP</h2><strong>${Object.keys(state.done).length} expériences validées</strong></div><div class="meter"><div style="width:${Math.min(100,Object.keys(state.done).length/20*100)}%"></div></div><div class="row" style="margin-top:20px">${list.map(([n,min])=>`<div class="badge ${Object.keys(state.done).length<min?'locked':''}"><strong>★</strong><b>${n}</b><p class="help">${min} réussites</p></div>`).join('')}</div></div><div class="section-heading"><h2>Journal des découvertes</h2></div><div class="panel">${state.history.length?state.history.slice(0,20).map(h=>`<div class="spread" style="border-bottom:1px solid #ffffff1d;padding:8px"><span>${esc(h.label)}</span><span class="stat">+${h.points} XP</span></div>`).join(''):'<p class="muted">Tes réussites apparaîtront ici après les défis.</p>'}</div>`}
function save(){return `${head('save','Sauvegarde','Tes progrès restent sur cet appareil tant que les données du navigateur sont conservées.')}<div class="panel"><h2>Profil de laboratoire</h2><label class="label" for="grade">Classe</label><select class="field" id="grade" onchange="state.grade=this.value;persist()">${['6e','5e','4e','3e'].map(x=>`<option ${x===state.grade?'selected':''}>${x}</option>`).join('')}</select><p class="help">Les activités restent accessibles à tous les niveaux ; le choix de classe sert à personnaliser ton profil.</p><div class="row" style="margin:20px 0">${btn('↓ Exporter JSON','exportSave()','cyan')}<label class="btn alt" for="import-file" style="cursor:pointer">↑ Importer JSON</label><input class="hidden" type="file" id="import-file" accept=".json,application/json" onchange="importSave(event)"></div><h3>Réinitialisation</h3><p class="muted">La remise à zéro supprime la progression stockée dans ce navigateur. Elle ne supprime pas les enregistrements déjà téléchargés.</p>${btn('Effacer ma progression','resetSave()','pink')}</div>`}function exportSave(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='soundlab-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}async function importSave(e){let f=e.target.files?.[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.v!==3||typeof d.done!=='object'||!Array.isArray(d.history)||typeof d.points!=='number')throw Error('Format incorrect');state={...blank,...d};persist();toast('Progression importée avec succès');render()}catch(err){toast('Sauvegarde non compatible : '+err.message)}}function resetSave(){if(confirm('Effacer définitivement toute la progression locale de SOUNDLAB ?')){state={...blank,done:{},visits:{},history:[],badges:[]};persist();render();toast('Progression réinitialisée')}}
function toggleStudio(open){let s=document.getElementById('studio'),body=document.getElementById('studio-body');let will=open===true||s.classList.contains('collapsed');s.classList.toggle('collapsed',!will);body.classList.toggle('hidden',!will);document.getElementById('studio-toggle').textContent=will?'Réduire':'Ouvrir';if(will)drawIdle()}function drawIdle(){let c=document.getElementById('rec-canvas');if(!c)return;let ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle='#8cf5e9';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,35);ctx.lineTo(c.width,35);ctx.stroke()}
async function beginRecord(){if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){document.getElementById('mic-state').textContent='Enregistrement incompatible : utilise un navigateur récent en HTTPS.';return}try{if(recorder?.state==='recording')return;clearRecord();stream=await navigator.mediaDevices.getUserMedia({audio:true});let allowed=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(stream,allowed?{mimeType:allowed}:undefined);let chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{recordBlob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});recordURL=URL.createObjectURL(recordBlob);let a=document.getElementById('record-play');a.src=recordURL;a.classList.remove('hidden');document.getElementById('download-btn').disabled=false;stopStream();document.getElementById('mic-state').textContent='Enregistrement prêt. Écoute et compare.'};recorder.onerror=()=>{document.getElementById('mic-state').textContent='Erreur du système d’enregistrement.';stopStream()};recorder.start();document.getElementById('record-btn').disabled=true;document.getElementById('stop-btn').disabled=false;document.getElementById('mic-state').innerHTML='<span class="recording">● Enregistrement en cours…</span>';try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=512;audioCtx.createMediaStreamSource(stream).connect(analyser);drawWave()}catch{drawIdle()}}catch(err){let msg=err.name==='NotAllowedError'?'Microphone refusé. Autorise-le dans les paramètres du navigateur.':err.name==='NotFoundError'?'Aucun microphone détecté.':err.name==='NotReadableError'?'Microphone déjà utilisé par une autre application.':'Microphone indisponible : '+err.name;document.getElementById('mic-state').textContent=msg;stopStream()}}function drawWave(){if(!analyser)return;let c=document.getElementById('rec-canvas'),ctx=c.getContext('2d'),d=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(d);ctx.clearRect(0,0,c.width,c.height);ctx.beginPath();ctx.lineWidth=2;ctx.strokeStyle='#7af9ef';for(let i=0;i<d.length;i++){let x=i/d.length*c.width,y=d[i]/255*c.height;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();recRAF=requestAnimationFrame(drawWave)}function stopStream(){cancelAnimationFrame(recRAF);analyser=null;if(audioCtx){audioCtx.close().catch(()=>{});audioCtx=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}document.getElementById('record-btn').disabled=false;document.getElementById('stop-btn').disabled=true;drawIdle()}function endRecord(){if(recorder?.state==='recording')recorder.stop()}function clearRecord(){if(recordURL){URL.revokeObjectURL(recordURL);recordURL=null}recordBlob=null;let a=document.getElementById('record-play');a.pause();a.removeAttribute('src');a.classList.add('hidden');document.getElementById('download-btn').disabled=true}function downloadRecord(){if(!recordBlob)return;let a=document.createElement('a'),u=URL.createObjectURL(recordBlob);a.href=u;a.download='soundlab-voix.'+(recordBlob.type.includes('mp4')?'m4a':recordBlob.type.includes('ogg')?'ogg':'webm');a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
render();drawIdle();
</script></body></html>
